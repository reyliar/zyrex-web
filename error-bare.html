<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Zyrex</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/content.png">
    <link rel="stylesheet" href="/css/style.css?v=92">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,800,900&display=swap">
    <style>
        :root { --err-bg:#141416; --err-ink:#6f6f78; --err-code:#777781; --err-btn-bg:#2a2a2f; --err-btn-ink:#c9c9d1; --err-btn-hover:#35353c; }
        html[data-zyrex-theme="light"] { --err-bg:#f5f7fc; --err-ink:#46618f; --err-code:#6d84a8; --err-btn-bg:#1b4fa8; --err-btn-ink:#ffffff; --err-btn-hover:#133a80; }
        html, body { margin:0; min-height:100%; background:var(--err-bg); }
        body.err-body { display:flex; flex-direction:column; min-height:100vh; background:var(--err-bg); color:var(--err-ink); font-family:'Satoshi',system-ui,sans-serif; }
        .err-main { position:relative; flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; padding:120px 24px; text-align:center; background:var(--err-bg); }
        .err-main::before { content:""; position:absolute; inset:0 0 auto; height:150px; background:linear-gradient(180deg,rgba(6, 6, 8, .92),rgba(20, 20, 22, 0)); pointer-events:none; }
        .err-code { position:relative; font-size:clamp(4.6rem,17vw,11rem); font-weight:800; letter-spacing:.06em; line-height:1; color:var(--err-code); }
        .err-home { position:relative; display:inline-flex; align-items:center; justify-content:center; padding:13px 32px; border:0; border-radius:0; background:var(--err-btn-bg); color:var(--err-btn-ink); font:inherit; font-size:.8rem; font-weight:750; letter-spacing:.04em; text-decoration:none; transition:background .15s ease,color .15s ease; }
        .err-home:hover { background:var(--err-btn-hover); color:#fff; }
        html[data-zyrex-theme="light"] .err-main::before, html[data-zyrex-theme="light"] .err-main::after { display:none; }
        .err-bare .err-main { padding:48px 22px; }

    </style>
    <link rel="stylesheet" href="/css/glass.css?v=67">
    <link rel="stylesheet" href="/css/atmosphere.css?v=7">
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.fontshare.com">
    <link rel="stylesheet" href="/css/i18n.css?v=3">
    <script src="/js/i18n.js?v=20" defer></script>
</head>
<body class="err-body err-bare">
    <div class="zr-sweep" aria-hidden="true"></div>
    <div class="lq-veil" aria-hidden="true"></div>
    <main class="err-main">
        <div class="err-code" id="errCode">404</div>
        <a class="err-home" href="https://zyrexediting.xyz">Back to home</a>
    </main>
    <script>
        (function () {
            var match = /[?&]code=(\d{3})/.exec(location.search || '');
            var code = match ? match[1] : '404';
            document.getElementById('errCode').textContent = code;
            document.title = code + ' | Zyrex';
        })();
    </script>
    <script src="/js/page-motion.js?v=6"></script>
</body>
</html>
