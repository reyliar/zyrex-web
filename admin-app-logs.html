<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>App Logs - Zyrex</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{color-scheme:dark;--text:#f8f5f6;--muted:#9d94a1;--accent:#ff2b52;--line:rgba(255,255,255,.1);--panel:rgba(20,14,20,.72)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 20px 60px;background:radial-gradient(ellipse at 12% 0%,rgba(255,43,82,.14),transparent 46%),#08060a;color:var(--text);font:400 14px/1.55 Outfit,Inter,system-ui,sans-serif}
.wrap{max-width:1220px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h1 i{color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:.8rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 320px;min-width:220px}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.search input{width:100%;padding:12px 14px 12px 38px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:rgba(255,43,82,.55);background:rgba(255,255,255,.07)}
button{font:inherit;color:var(--text);background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:12px;padding:11px 16px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
button.primary{background:linear-gradient(115deg,#ff2b52,#d62972);border-color:transparent;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:.78rem}
.stat b{color:var(--text)}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.table-scroll{overflow:auto;max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:1040px}
th{position:sticky;top:0;z-index:1;text-align:left;padding:11px 12px;background:#170f16;color:#e0a8b6;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.055);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.045)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem}
.id{color:#ffd3dc}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.68rem;font-weight:700;border:1px solid transparent;white-space:nowrap}
.tag.start{color:#cbb6ff;background:rgba(122,92,255,.14);border-color:rgba(122,92,255,.32)}
.tag.complete{color:#a8f0ce;background:rgba(32,184,121,.14);border-color:rgba(32,184,121,.34)}
.tag.error{color:#ffd2d9;background:rgba(255,43,82,.14);border-color:rgba(255,43,82,.34)}
.tag.denied{color:#ffe0b0;background:rgba(255,171,64,.14);border-color:rgba(255,171,64,.34)}
.muted{color:var(--muted)}
.denied{color:#ffcb85}
.leak{color:#fff;font-weight:600}
.leak small{display:block;color:var(--muted);font-weight:400;font-size:.72rem}
.detail{display:none;background:rgba(0,0,0,.28)}
.detail.open{display:table-row}
.detail pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:.74rem;color:#cfc4d0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.gate{max-width:460px;margin:12vh auto;text-align:center;padding:34px 26px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.gate i{font-size:2rem;color:var(--accent)}
.gate h2{margin:14px 0 8px;font-size:1.1rem}
.gate p{color:var(--muted);margin:0 0 18px;font-size:.85rem}
a.btn{display:inline-block;padding:11px 18px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);text-decoration:none}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate hidden">
    <i class="fas fa-lock"></i>
    <h2>Founder access required</h2>
    <p>This log is limited to the site founder.</p>
    <a class="btn" href="/api/login?redirect=%2Fadmin-app-logs">Sign in with Discord</a>
  </div>

  <div id="app" class="hidden">
    <header>
      <div>
        <h1><i class="fas fa-list-check"></i> Installer logs</h1>
        <p class="sub">Every launch and preset install reported by the desktop app.</p>
      </div>
      <button id="refresh"><i class="fas fa-rotate"></i> Refresh</button>
    </header>

    <div class="toolbar">
      <label class="search">
        <i class="fas fa-magnifying-glass"></i>
        <input id="q" type="search" placeholder="Search Discord ID, username, leak, event, error…" autocomplete="off" spellcheck="false">
      </label>
      <button class="primary" id="searchBtn"><i class="fas fa-search"></i> Search</button>
    </div>

    <div class="stat">
      <span>Entries: <b id="total">0</b></span>
      <span>Showing: <b id="matched">0</b></span>
      <span>Updated: <b id="updated">—</b></span>
    </div>

    <div class="card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Date (UTC)</th>
              <th>Discord ID</th>
              <th>Username</th>
              <th>Event</th>
              <th>Leak</th>
              <th>Platform</th>
              <th>Installed</th>
              <th>Duration</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let entries = [];
  let visible = [];

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  function when(iso) {
    if (!iso) return '—';
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return esc(iso);
    const pad = n => String(n).padStart(2, '0');
    return date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate()) +
      ' ' + pad(date.getUTCHours()) + ':' + pad(date.getUTCMinutes()) + ':' + pad(date.getUTCSeconds());
  }
  function duration(ms) {
    const value = Number(ms) || 0;
    if (!value) return '—';
    return value < 1000 ? value + ' ms' : (value / 1000).toFixed(1) + ' s';
  }
  function eventTag(event) {
    const icons = { start: 'fa-play', complete: 'fa-circle-check', error: 'fa-triangle-exclamation', 'access-denied': 'fa-lock' };
    const key = icons[event] ? (event === 'access-denied' ? 'denied' : event) : 'start';
    return '<span class="tag ' + key + '"><i class="fas ' + (icons[event] || icons.start) + '"></i> ' + esc(event || key) + '</span>';
  }

  function render() {
    const rows = $('rows');
    if (!visible.length) {
      rows.innerHTML = '<tr><td colspan="9" class="empty">No log entries yet.</td></tr>';
      return;
    }
    rows.innerHTML = visible.map((entry, index) => {
      const installed = entry.event === 'complete'
        ? esc(entry.installed)
          + (Number(entry.skipped) ? ' <span class="muted">(+' + esc(entry.skipped) + ' kept)</span>' : '')
          + (Number(entry.failed) ? ' <span class="denied">(' + esc(entry.failed) + ' locked)</span>' : '')
        : (Number(entry.total) ? esc(entry.total) + ' queued' : '—');
      const detail = JSON.stringify(entry, null, 2);
      return '<tr data-index="' + index + '">' +
        '<td class="mono">' + when(entry.at) + '</td>' +
        '<td class="mono id">' + esc(entry.discord_id) + '</td>' +
        '<td>' + esc(entry.username || '—') + '</td>' +
        '<td>' + eventTag(entry.event) + '</td>' +
        '<td><span class="leak">' + esc(entry.product_name || '—') + '<small class="mono">' + esc(entry.product_id || '') + '</small></span></td>' +
        '<td class="mono">' + esc(entry.platform || '—') + '</td>' +
        '<td class="mono">' + installed + '</td>' +
        '<td class="mono">' + duration(entry.duration_ms) + '</td>' +
        '<td class="mono muted">' + esc(entry.ip || '—') + '</td>' +
        '</tr>' +
        '<tr class="detail" data-detail="' + index + '"><td colspan="9"><pre>' + esc(detail) + '</pre></td></tr>';
    }).join('');
  }

  $('rows').addEventListener('click', event => {
    const row = event.target.closest('tr[data-index]');
    if (!row) return;
    const detail = document.querySelector('tr[data-detail="' + row.dataset.index + '"]');
    if (detail) detail.classList.toggle('open');
  });

  function keyOf(entry) {
    return [entry.discord_id, entry.username, entry.product_id, entry.product_name, entry.event, entry.platform, entry.version, entry.error, entry.ip, entry.at]
      .map(value => String(value || '').toLowerCase()).join(' ');
  }

  function applyFilter() {
    const query = $('q').value.trim().toLowerCase();
    visible = query ? entries.filter(entry => keyOf(entry).includes(query)) : entries;
    $('matched').textContent = String(visible.length);
    render();
  }

  async function load() {
    const query = $('q').value.trim();
    $('refresh').disabled = true;
    try {
      const response = await fetch('/api/installer/logs?limit=2000' + (query ? '&q=' + encodeURIComponent(query) : ''), { credentials: 'include', cache: 'no-store' });
      if (response.status === 403) { $('app').classList.add('hidden'); $('gate').classList.remove('hidden'); return; }
      const data = await response.json();
      entries = Array.isArray(data.entries) ? data.entries : [];
      visible = entries;
      $('total').textContent = String(data.total || 0);
      $('matched').textContent = String(visible.length);
      $('updated').textContent = data.updated_at ? when(data.updated_at) + ' UTC' : '—';
      render();
    } catch (_) {
      $('rows').innerHTML = '<tr><td colspan="9" class="empty">Could not load the log.</td></tr>';
    } finally {
      $('refresh').disabled = false;
    }
  }

  async function boot() {
    let user = null;
    try {
      const response = await fetch('/api/me', { credentials: 'include', cache: 'no-store' });
      if (response.status === 401) { $('gate').classList.remove('hidden'); return; }
      user = await response.json();
    } catch (_) {
      $('gate').classList.remove('hidden');
      return;
    }
    if (!user || !user.is_admin) { $('gate').classList.remove('hidden'); return; }
    $('app').classList.remove('hidden');
    load();
  }

  $('refresh').addEventListener('click', load);
  $('searchBtn').addEventListener('click', load);
  $('q').addEventListener('keydown', event => { if (event.key === 'Enter') load(); });
  let debounce = null;
  $('q').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(applyFilter, 220); });
  setInterval(() => { if (!$('app').classList.contains('hidden')) load(); }, 30000);
  boot();
})();
</script>
</body>
</html>
