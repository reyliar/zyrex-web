name: Build and Release Leak Preset Installers

on:
  workflow_dispatch:
    inputs:
      preset_id:
        description: Published Zyrex leak ID (leave empty when backfilling all)
        required: false
        type: string
      backfill_all:
        description: Build every existing preset leak that has production FFX files
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [zyrex_preset_published]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: github.event_name == 'repository_dispatch' || inputs.backfill_all == true || inputs.preset_id != ''
    runs-on: ubuntu-latest
    outputs:
      product_ids: ${{ steps.targets.outputs.product_ids }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover all existing leaks with FFX source
        if: inputs.backfill_all == true
        env:
          FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
        run: python tools/zyrex_effects_installer/discover_sources.py > "$RUNNER_TEMP/product_ids.json"

      - name: Select requested leak
        if: inputs.backfill_all != true
        env:
          PRODUCT_ID: ${{ github.event.client_payload.product_id || inputs.preset_id }}
        run: python -c 'import json,os,re,pathlib; p=os.environ["PRODUCT_ID"].strip(); assert re.fullmatch(r"[A-Za-z0-9_-]{1,100}",p), "Invalid preset ID"; pathlib.Path(os.environ["RUNNER_TEMP"],"product_ids.json").write_text(json.dumps([p]))'

      - name: Publish build matrix
        id: targets
        run: echo "product_ids=$(cat "$RUNNER_TEMP/product_ids.json")" >> "$GITHUB_OUTPUT"

  build-installers:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [windows, macOS]
        product_id: ${{ fromJson(needs.prepare.outputs.product_ids) }}
    env:
      FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: bash
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Fetch this leak's production FFX files
        shell: bash
        run: python tools/zyrex_effects_installer/fetch_source.py --preset-id "${{ matrix.product_id }}" --output "$RUNNER_TEMP/zyrex-ffx-source"

      - name: Credit FFX presets and build the platform installer
        shell: bash
        run: python tools/zyrex_effects_installer/build_release.py --preset-id "${{ matrix.product_id }}" --source "$RUNNER_TEMP/zyrex-ffx-source" --output-root "$RUNNER_TEMP/zyrex-release"

      - name: Upload platform build for assembly
        uses: actions/upload-artifact@v4
        with:
          name: zyrex-build-${{ matrix.product_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/zyrex-release/**
          if-no-files-found: error
          retention-days: 1

  assemble-release:
    needs: build-installers
    if: needs.build-installers.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and macOS folders
        uses: actions/download-artifact@v4
        with:
          pattern: zyrex-build-*
          path: release
          merge-multiple: true

      - name: Upload combined release folders
        uses: actions/upload-artifact@v4
        with:
          name: zyrex-windows-macos-installers
          path: release/**
          if-no-files-found: error
          retention-days: 30
