name: Build and Release Leak Preset Installers

on:
  workflow_dispatch:
    inputs:
      preset_id:
        description: Published Zyrex leak ID (leave empty when backfilling all)
        required: false
        type: string
      backfill_all:
        description: Build every existing preset leak that has production FFX files
        required: false
        default: false
        type: boolean
      preset_ids:
        description: Comma-separated leak IDs to build or retry
        required: false
        type: string
      base_run_id:
        description: Existing Actions run whose successful installer artifacts should be included
        required: false
        type: string
      assemble_only:
        description: Assemble successful artifacts from base_run_id without rebuilding leaks
        required: false
        default: false
        type: boolean
      reconcile_catalogue:
        description: After a backfill, hide every leak that still misses an app download and re-queue its build
        required: false
        default: true
        type: boolean
      migrate_ids:
        description: Comma-separated leak IDs whose legacy installer objects should move into the leak folder
        required: false
        type: string
      relocate_sources:
        description: Move every preset leak's FFX source into the _source_ffx backup so only installers ship
        required: false
        default: false
        type: boolean
      restore_sources:
        description: Bring project files, tutorials and images that an earlier relocation moved back into their leak folder
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [zyrex_preset_published]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: >-
      github.event_name == 'repository_dispatch' || inputs.backfill_all == true ||
      inputs.preset_id != '' || inputs.preset_ids != '' || inputs.base_run_id != '' ||
      inputs.assemble_only == true || inputs.migrate_ids != ''
    runs-on: ubuntu-latest
    outputs:
      product_ids: ${{ steps.targets.outputs.product_ids }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover all existing leaks with FFX source
        if: inputs.backfill_all == true
        env:
          FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
        run: python tools/zyrex_effects_installer/discover_sources.py > "$RUNNER_TEMP/product_ids.json"

      - name: Select requested leak
        if: inputs.backfill_all != true && inputs.assemble_only != true && inputs.migrate_ids == ''
        env:
          PRODUCT_IDS: ${{ inputs.preset_ids || github.event.client_payload.product_id || inputs.preset_id }}
        run: python -c 'import json,os,re,pathlib; ids=[p.strip() for p in os.environ["PRODUCT_IDS"].split(",") if p.strip()]; assert ids and all(re.fullmatch(r"[A-Za-z0-9_-]{1,100}",p) for p in ids), "Invalid preset ID list"; pathlib.Path(os.environ["RUNNER_TEMP"],"product_ids.json").write_text(json.dumps(list(dict.fromkeys(ids))))'

      - name: Select no build targets for assembly-only releases
        if: inputs.assemble_only == true
        run: echo '[]' > "$RUNNER_TEMP/product_ids.json"

      - name: Select no build targets for migration runs
        if: inputs.migrate_ids != ''
        run: echo '[]' > "$RUNNER_TEMP/product_ids.json"

      - name: Publish build matrix
        id: targets
        run: echo "product_ids=$(cat "$RUNNER_TEMP/product_ids.json")" >> "$GITHUB_OUTPUT"

  windows-installers:
    needs: prepare
    if: needs.prepare.result == 'success' && inputs.assemble_only != true && inputs.migrate_ids == '' && inputs.relocate_sources != true
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        product_id: ${{ fromJson(needs.prepare.outputs.product_ids) }}
    env:
      FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4
      - name: Build credited Windows installer
        uses: ./.github/actions/build-leak-installer
        with:
          preset_id: ${{ matrix.product_id }}
          platform: windows
          release_id: ${{ github.run_id }}

  macos-installers:
    needs: prepare
    if: needs.prepare.result == 'success' && inputs.assemble_only != true && inputs.migrate_ids == '' && inputs.relocate_sources != true
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        product_id: ${{ fromJson(needs.prepare.outputs.product_ids) }}
    env:
      FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4
      - name: Build credited macOS installer
        uses: ./.github/actions/build-leak-installer
        with:
          preset_id: ${{ matrix.product_id }}
          platform: macOS
          release_id: ${{ github.run_id }}

  relocate-sources:
    if: inputs.relocate_sources == true || inputs.restore_sources == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Move FFX sources into the backup prefix
        if: inputs.restore_sources != true
        run: python tools/zyrex_effects_installer/relocate_sources.py --mode move

      - name: Restore non-FFX files into their leak folders
        if: inputs.restore_sources == true
        run: python tools/zyrex_effects_installer/relocate_sources.py --mode restore

  migrate-installers:
    needs: prepare
    if: needs.prepare.result == 'success' && inputs.migrate_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Move legacy installer objects into their leak folders
        env:
          MIGRATE_IDS: ${{ inputs.migrate_ids }}
        run: python tools/zyrex_effects_installer/migrate_installers.py --ids "$MIGRATE_IDS"

  assemble-release:
    needs: [prepare, windows-installers, macos-installers]
    if: always() && needs.prepare.result == 'success' && (inputs.assemble_only == true || inputs.base_run_id != '' || (needs.windows-installers.result == 'success' && needs.macos-installers.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build installer artifact index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BASE_RUN_ID: ${{ inputs.base_run_id }}
        run: python tools/zyrex_effects_installer/create_release_index.py --output "$RUNNER_TEMP/zyrex-release-index"

      - name: Upload installer artifact index
        uses: actions/upload-artifact@v4
        with:
          name: zyrex-windows-macos-installers-index
          path: ${{ runner.temp }}/zyrex-release-index/**
          if-no-files-found: error
          retention-days: 30

  reconcile-catalogue:
    needs: [prepare, assemble-release]
    if: always() && inputs.backfill_all == true && inputs.reconcile_catalogue != false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FFX_RELEASE_SOURCE_TOKEN: ${{ secrets.FFX_RELEASE_SOURCE_TOKEN }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hide every leak that still misses an app download
        run: python tools/zyrex_effects_installer/reconcile_catalogue.py
