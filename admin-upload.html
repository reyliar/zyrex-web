<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Zyrex | Admin — Add Plugin</title>
    <link rel="icon" type="image/png" href="/assets/content.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cherry-light: #ff2b52;
            --glass-bg: rgba(14,10,18,0.82);
            --glass-border: rgba(255,255,255,0.12);
            --text-muted: rgba(255,255,255,0.5);
            --ok: #34d399;
            --warn: #fbbf24;
            --danger: #f87171;
        }
        body {
            background: #070209;
            color: #f8f5f6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-top: 80px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 0%, rgba(255,43,82,0.16) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(120,0,40,0.1) 0%, transparent 35%),
                radial-gradient(circle at 50% 100%, rgba(60,0,20,0.08) 0%, transparent 50%);
        }

        /* ── TOPBAR ── */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 clamp(18px, 4vw, 48px); height: 68px;
            background: rgba(7,2,9,0.88);
            backdrop-filter: blur(28px) saturate(200%);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-family: 'Outfit', sans-serif; font-weight: 800; }
        .brand img { height: 32px; }
        .brand-badge { font-size: 0.58rem; font-weight: 800; background: linear-gradient(135deg, #ff2b52, #c8002a); color: #fff; padding: 3px 9px; border-radius: 999px; letter-spacing: 1.2px; text-transform: uppercase; }
        .top-nav { display: flex; align-items: center; gap: 10px; }
        .top-nav a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.8rem; font-weight: 600; transition: all 0.2s ease; }
        .top-nav a:hover { background: rgba(255,255,255,0.12); }

        /* ── SHELL ── */
        .shell { width: min(960px, calc(100% - 40px)); margin: 40px auto 90px; display: flex; flex-direction: column; gap: 20px; }

        /* ── GLASS PANEL ── */
        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 36px 40px;
            backdrop-filter: blur(32px) saturate(210%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        /* ── HERO HEADER ── */
        .panel-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .panel-icon { width: 54px; height: 54px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
        .panel-hero h2 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: -0.3px; margin-bottom: 4px; }
        .panel-hero p { font-size: 0.83rem; color: var(--text-muted); }

        /* ── FORM ── */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            font: 500 0.85rem 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: rgba(255,43,82,0.45);
            box-shadow: 0 0 0 3px rgba(255,43,82,0.1);
        }
        .form-group textarea { min-height: 90px; resize: vertical; }
        .form-group select { appearance: none; cursor: pointer; }
        .form-group select option { background: #0e0a14; }

        /* ── ALERT ── */
        .alert {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.84rem;
            font-weight: 600;
            margin-bottom: 22px;
            display: none;
            border: 1px solid rgba(248,113,113,0.3);
            background: rgba(248,113,113,0.1);
            color: var(--danger);
        }
        .alert.show { display: block; }
        .alert.alert-success { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.1); color: var(--ok); }

        /* ── PREVIEW CARD ── */
        .preview-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 22px 24px;
            margin-top: 24px;
            background: rgba(0,0,0,0.25);
        }
        .preview-card h4 {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* ── CODE OUTPUT ── */
        .code-output {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 22px;
            margin-top: 20px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--ok);
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        .code-output.show { display: block; }

        /* ── BUTTONS ── */
        .btn-row { display: flex; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.07); flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font: 700 0.84rem 'Inter', sans-serif; cursor: pointer; border: none; text-decoration: none; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }
        .btn-primary { background: linear-gradient(135deg, #ff2b52, #c8002a); color: #fff; box-shadow: 0 8px 20px rgba(255,43,82,0.35); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,43,82,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.13); }
        .btn-secondary:hover { background: rgba(255,255,255,0.13); }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; box-shadow: 0 8px 20px rgba(34,197,94,0.3); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(34,197,94,0.45); }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .panel { padding: 24px 20px; }
            .btn-row { flex-direction: column; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <img src="/assets/content.png" alt="Zyrex">
            <span>ZYREX</span>
            <span class="brand-badge">Admin</span>
        </a>
        <nav class="top-nav">
            <a href="/settings"><i class="fas fa-arrow-left"></i> Settings</a>
            <a href="/api/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </header>

    <main class="shell">
        <div class="panel">
            <div class="panel-hero">
                <div class="panel-icon" style="background:linear-gradient(135deg,rgba(99,102,241,0.25),rgba(60,60,200,0.12));color:#818cf8;box-shadow:0 8px 20px rgba(99,102,241,0.2)">
                    <i class="fas fa-puzzle-piece"></i>
                </div>
                <div>
                    <h2>Add Plugin / Software</h2>
                    <p>Generate a new entry for <code style="background:rgba(255,255,255,0.07);padding:2px 7px;border-radius:6px;font-size:0.8rem">plugins-data.js</code> or publish dynamically. Fill the form to get started.</p>
                </div>
            </div>

            <div id="alertBox" class="alert"></div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tag" style="margin-right:5px;opacity:0.7"></i>Product Name *</label>
                    <input type="text" id="prodName" placeholder="e.g. BorisFX Sapphire AE 2026.5" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-folder" style="margin-right:5px;opacity:0.7"></i>Category *</label>
                    <select id="prodCategory" onchange="updatePreview()">
                        <option value="">Select...</option>
                        <option value="software">Software</option>
                        <option value="adobe-plugin">Adobe Plugin</option>
                        <option value="ofx-plugin">OFX Plugin</option>
                        <option value="avx">AVX</option>
                        <option value="extensions-scripts">Extensions & Scripts</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-desktop" style="margin-right:5px;opacity:0.7"></i>Platform *</label>
                    <select id="prodPlatform" onchange="updatePreview()">
                        <option value="">Select...</option>
                        <option value="win">Windows</option>
                        <option value="mac">Mac</option>
                        <option value="both">Both (Win + Mac)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key" style="margin-right:5px;opacity:0.7"></i>ZIP Password</label>
                    <input type="text" id="prodPassword" placeholder="Leave empty if none" oninput="updatePreview()">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-align-left" style="margin-right:5px;opacity:0.7"></i>Description</label>
                <textarea id="prodDesc" placeholder="Describe the plugin/software..." oninput="updatePreview()"></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-circle-info" style="margin-right:5px;opacity:0.7"></i>Notes (optional)</label>
                <input type="text" id="prodNotes" placeholder="e.g. Compatible with AE 2025+" oninput="updatePreview()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-link" style="margin-right:5px;opacity:0.7"></i>Download URL *</label>
                    <input type="url" id="prodUrl" placeholder="https://..." oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tag" style="margin-right:5px;opacity:0.7"></i>Link Label</label>
                    <input type="text" id="prodLabel" placeholder="e.g. GoFile (direct)" value="GoFile (direct)" oninput="updatePreview()">
                </div>
            </div>

            <!-- PREVIEW -->
            <div class="preview-card" id="previewCard">
                <h4><i class="fas fa-eye" style="color:var(--cherry-light)"></i> Live Preview</h4>
                <div id="previewContent" style="font-family:Consolas,monospace;font-size:0.79rem;color:rgba(255,255,255,0.5);line-height:1.7"></div>
            </div>

            <!-- CODE OUTPUT -->
            <div class="code-output" id="codeOutput"></div>

            <div class="btn-row">
                <button class="btn btn-primary" onclick="publishLive()"><i class="fas fa-rocket"></i> Publish Live</button>
                <button class="btn btn-secondary" onclick="generateCode()"><i class="fas fa-code"></i> Generate Code</button>
                <button class="btn btn-success" id="btnCopy" onclick="copyCode()" style="display:none"><i class="fas fa-copy"></i> Copy</button>
                <button class="btn btn-secondary" onclick="clearForm()"><i class="fas fa-undo"></i> Clear</button>
                <a href="/settings" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js?v=10"></script>
    <script>
        // Auth check — admin only
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const resp = await fetch('/api/me', { credentials: 'include' });
                if (!resp.ok) { redirectToLogin(); return; }
                const user = await resp.json();
                if (!user.is_admin) {
                    document.body.innerHTML = `<div style="text-align:center;padding:150px 20px;color:rgba(255,255,255,0.5)"><i class="fas fa-lock" style="font-size:4rem;color:#ff2b52;opacity:.3;display:block;margin-bottom:20px"></i><h2 style="font-family:Outfit,sans-serif;color:#fff">Access Denied</h2><p style="margin-top:10px">Admin only.</p><a href="/" style="color:#ff2b52;margin-top:20px;display:inline-block">Go Home</a></div>`;
                }
            } catch(e) { redirectToLogin(); }
        });

        function updatePreview() {
            const n = document.getElementById('prodName').value.trim() || 'Untitled';
            const c = document.getElementById('prodCategory').value || 'software';
            const p = document.getElementById('prodPlatform').value || 'win';
            const pw = document.getElementById('prodPassword').value.trim();
            const d = document.getElementById('prodDesc').value.trim() || 'No description.';
            const nt = document.getElementById('prodNotes').value.trim();
            const u = document.getElementById('prodUrl').value.trim() || 'https://...';
            const l = document.getElementById('prodLabel').value.trim() || 'Download';

            const preview = document.getElementById('previewContent');
            preview.innerHTML = `
<span style="color:#fbbf24">{</span>
  <span style="color:#fbbf24">id:</span> <span style="color:#34d399">makeId('${n}')</span>,
  <span style="color:#fbbf24">name:</span> <span style="color:#34d399">'${n}'</span>,
  <span style="color:#fbbf24">category:</span> <span style="color:#34d399">'${c}'</span>, <span style="color:#fbbf24">platform:</span> <span style="color:#34d399">'${p}'</span>, <span style="color:#fbbf24">password:</span> <span style="color:#60a5fa">${pw ? "'" + pw + "'" : 'null'}</span>,
  <span style="color:#fbbf24">desc:</span> <span style="color:#34d399">'${d.replace(/'/g,"\\'")}' </span>,
  ${nt ? `<span style="color:#fbbf24">notes:</span> <span style="color:#34d399">'${nt.replace(/'/g,"\\'")}' </span>,\n  ` : ''}<span style="color:#fbbf24">links:</span> [{ <span style="color:#fbbf24">url:</span> <span style="color:#34d399">'${u}'</span>, <span style="color:#fbbf24">label:</span> <span style="color:#34d399">'${l}'</span> }]
<span style="color:#fbbf24">}</span>`;
        }

        function generateCode() {
            const n = document.getElementById('prodName').value.trim();
            const c = document.getElementById('prodCategory').value;
            const p = document.getElementById('prodPlatform').value;
            const u = document.getElementById('prodUrl').value.trim();

            if (!n || !c || !p || !u) {
                showAlert('Please fill Name, Category, Platform, and Download URL.', true);
                return;
            }

            const pw = document.getElementById('prodPassword').value.trim();
            const d = document.getElementById('prodDesc').value.trim() || 'No description.';
            const nt = document.getElementById('prodNotes').value.trim();
            const l = document.getElementById('prodLabel').value.trim() || 'Download';

            const code = `    {
        id: makeId('${n}'),
        name: '${n}',
        category: '${c}', platform: '${p}', password: ${pw ? "'" + pw + "'" : 'null'},
        desc: '${d.replace(/'/g,"\\'")}',
        ${nt ? `notes: '${nt.replace(/'/g,"\\'")}',\n        ` : ''}links: [{ url: '${u}', label: '${l}' }]
    },`;

            const output = document.getElementById('codeOutput');
            output.textContent = code;
            output.classList.add('show');
            document.getElementById('btnCopy').style.display = 'inline-flex';
            output.scrollIntoView({ behavior: 'smooth' });
            showAlert('Code generated! Copy and add to plugins-data.js', false);
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(code).then(() => {
                showAlert('Copied! Paste into js/plugins-data.js', false);
            });
        }

        function clearForm() {
            ['prodName','prodCategory','prodPlatform','prodPassword','prodDesc','prodNotes','prodUrl','prodLabel'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('prodLabel').value = 'GoFile (direct)';
            document.getElementById('codeOutput').classList.remove('show');
            document.getElementById('btnCopy').style.display = 'none';
            updatePreview();
        }

        function showAlert(msg, isError) {
            const box = document.getElementById('alertBox');
            box.innerHTML = msg;
            box.className = 'alert show' + (isError ? '' : ' alert-success');
            if (!msg.includes('fa-spin')) {
                setTimeout(() => box.classList.remove('show'), 5000);
            }
        }

        async function publishLive() {
            const n = document.getElementById('prodName').value.trim();
            const c = document.getElementById('prodCategory').value;
            const p = document.getElementById('prodPlatform').value;
            const u = document.getElementById('prodUrl').value.trim();

            if (!n || !c || !p || !u) {
                showAlert('Please fill Name, Category, Platform, and Download URL.', true);
                return;
            }

            const pw = document.getElementById('prodPassword').value.trim();
            const d = document.getElementById('prodDesc').value.trim() || 'No description.';
            const nt = document.getElementById('prodNotes').value.trim();
            const l = document.getElementById('prodLabel').value.trim() || 'Download';

            const payload = {
                name: n, category: c, platform: p, description: d,
                password: pw || null, notes: nt || null,
                links: [{ url: u, label: l }], type: 'plugin'
            };

            showAlert('<i class="fas fa-shield-halved fa-spin" style="color:#ff2b52;margin-right:6px"></i> Scanning download link with VirusTotal & publishing...', false);
            try {
                const resp = await fetch('/api/products/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                });
                const result = await resp.json();
                if (resp.ok && result.success) {
                    const newId = result.id || makeId(n);
                    try {
                        const key = 'zyrex_new_products';
                        const items = JSON.parse(localStorage.getItem(key) || '[]');
                        items.push({ id: newId, name: n, type: 'plugin', category: c, platform: p, desc: d, password: pw||null, notes: nt||null, links: [{url:u,label:l}] });
                        localStorage.setItem(key, JSON.stringify(items));
                    } catch(e) {}
                    showAlert('Published! Redirecting to product page...', false);
                    setTimeout(() => { window.location.href = '/product?id=' + newId; }, 1500);
                } else {
                    showAlert('Publish failed: ' + (result.error || 'Unknown error'), true);
                }
            } catch(e) {
                showAlert('Network error: ' + e.message, true);
            }
        }

        function makeId(name) {
            return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        updatePreview();
    </script>
</body>
</html>
