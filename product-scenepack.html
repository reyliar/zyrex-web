<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zyrex Scenepacks - Premium scene packs & project templates">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zyrexediting.xyz/product-scenepack">
    <meta property="og:title" content="Zyrex | Scenepack">
    <meta property="og:description" content="Premium scenepacks on Zyrex">
    <meta name="author" content="Zyrex">
    <title>Zyrex | Scenepack</title>
    <link rel="icon" type="image/png" href="/assets/content.png">
    <link rel="stylesheet" href="css/style.css?v=24">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cherry: #ff2b52;
            --cherry-rgb: 255, 43, 82;
            --cherry-light: #ff6b85;
            --cherry-dark: #c8002a;
            --glass-bg: rgba(14, 10, 18, 0.82);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-muted: rgba(255, 255, 255, 0.5);
            --ok: #34d399;
        }

        body {
            background: #070209;
            color: #f8f5f6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 43, 82, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(120, 0, 40, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 20, 0.08) 0%, transparent 50%);
        }

        .sp-page {
            padding: 130px 0 90px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.8);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 32px;
            backdrop-filter: blur(20px);
            transition: all 0.25s ease;
        }
        .back:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            transform: translateX(-3px);
        }

        /* Glass Hero Card */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 36px;
            backdrop-filter: blur(32px) saturate(210%);
            -webkit-backdrop-filter: blur(32px) saturate(210%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }

        .hero-layout {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        @media (max-width: 768px) {
            .hero-layout { flex-direction: column; text-align: center; }
        }

        .preview-box {
            width: 200px;
            height: 140px;
            border-radius: 22px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 43, 82, 0.2), rgba(10, 2, 8, 0.8));
            border: 1px solid rgba(255, 43, 82, 0.25);
            box-shadow: 0 12px 35px rgba(255, 43, 82, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-box i.ph {
            font-size: 3rem;
            color: var(--cherry-light);
            opacity: 0.5;
        }

        .sp-details {
            flex: 1;
            min-width: 0;
        }
        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(255, 43, 82, 0.12);
            border: 1px solid rgba(255, 43, 82, 0.25);
            color: var(--cherry-light);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .sp-details h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.25;
        }
        .sp-details p.desc {
            font-size: 0.86rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Single Download CTA Box */
        .cta-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 24px 32px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            margin-top: 10px;
        }
        @media (max-width: 640px) {
            .cta-box { flex-direction: column; text-align: center; }
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff2b52, #c8002a);
            color: #fff;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 0.92rem;
            box-shadow: 0 10px 25px rgba(255, 43, 82, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(255, 43, 82, 0.55);
        }

        /* Meta Grid */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .meta-item {
            padding: 18px 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .meta-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255,43,82,0.12);
            color: var(--cherry-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .meta-text strong { display: block; font-size: 0.88rem; color: #fff; font-family: 'Outfit', sans-serif; }
        .meta-text span { font-size: 0.72rem; color: var(--text-muted); }

        /* Uploader & Creator */
        .creators-flex {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        .creator-card {
            flex: 1;
            min-width: 240px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
        }
        .creator-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--cherry);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,43,82,0.15);
            color: #fff;
            flex-shrink: 0;
        }
        .creator-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .creator-info strong { display: block; font-size: 0.9rem; color: #fff; font-family: 'Outfit', sans-serif; }
        .creator-info span { font-size: 0.74rem; color: var(--text-muted); }
        .creator-info a { color: var(--cherry-light); text-decoration: none; font-size: 0.75rem; font-weight: 600; margin-top: 2px; display: inline-block; }
        .creator-info a:hover { text-decoration: underline; }

        .load-state, .err-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .load-state i, .err-state i { font-size: 2.5rem; color: var(--cherry-light); margin-bottom: 16px; display: block; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <img src="assets/content.png" alt="ZYREX" class="logo-img">
                <span class="logo-text">yrex</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="/">Home</a></li>
                <li><a href="/resources">Resources</a></li>
                <li><a href="/scenepack.html">Scenepacks</a></li>
                <li><a href="/plugins">Plugins</a></li>
                <li><a href="/more">More</a></li>
            </ul>
            <div class="nav-actions">
                <div id="authBtn"></div>
                <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <main class="sp-page">
        <div class="wrap">
            <a href="/scenepack.html" class="back"><i class="fas fa-arrow-left"></i> Back to Scenepacks</a>

            <div id="load" class="load-state">
                <i class="fas fa-clapperboard fa-spin"></i>
                <p>Loading scenepack details...</p>
            </div>

            <div id="err" class="err-state" style="display:none">
                <i class="fas fa-triangle-exclamation"></i>
                <h2 style="font-family:Outfit,sans-serif;color:#fff;margin-bottom:8px" id="errMsg">Scenepack not found</h2>
                <a href="/scenepack.html" class="btn-download" style="margin-top:16px"><i class="fas fa-clapperboard"></i> Browse Scenepacks</a>
            </div>

            <div id="root" style="display:none"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 Zyrex Editing. All rights reserved.</p></div>
        </div>
    </footer>

    <script src="js/auth.js?v=10"></script>
    <script src="js/script.js?v=5"></script>
    <script>
    (async function(){
        var p = new URLSearchParams(location.search);
        var id = p.get('id');
        if (!id) return showErr('Scenepack ID missing');
        try {
            var r = await fetch('/api/products?id=' + encodeURIComponent(id));
            if (!r.ok) { showErr('Scenepack not found'); return; }
            var data = await r.json();
            if (!data || !data.id) { showErr('Scenepack not found'); return; }
            if (data.type !== 'scenepack') { showErr('This product is not a scenepack. <a href="/'+data.type+'" style="color:var(--cherry-light)">View on '+data.type+' page</a>'); return; }
            render(data);
        } catch(e) { showErr('Failed to load scenepack'); }
    })();

    function showErr(m) {
        document.getElementById('load').style.display = 'none';
        document.getElementById('err').style.display = 'block';
        document.getElementById('errMsg').innerHTML = m;
    }

    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function render(p) {
        document.getElementById('load').style.display = 'none';
        document.getElementById('root').style.display = 'block';
        document.title = (p.name || 'Scenepack') + ' \u2014 Zyrex Scenepacks';

        var downloadUrl = p.source_url || p.file_url || '';
        var hostname = '';
        try { hostname = new URL(downloadUrl).hostname.replace('www.', ''); } catch(e) {}

        var html = '';

        // Glass Hero Section
        html += '<div class="glass-card"><div class="hero-layout">';
        html += '<div class="preview-box">';
        if (p.thumbnail) {
            html += '<img src="' + esc(p.thumbnail) + '" alt="">';
        } else {
            html += '<i class="fas fa-film ph"></i>';
        }
        html += '</div>';

        html += '<div class="sp-details">';
        html += '<span class="type-badge"><i class="fas fa-clapperboard"></i> Scenepack</span>';
        html += '<h1>' + esc(p.name || 'Untitled Scenepack') + '</h1>';
        if (p.description || p.desc) {
            html += '<p class="desc">' + esc(p.description || p.desc) + '</p>';
        }
        html += '</div></div></div>';

        // CTA Section (Single Download Link)
        html += '<div class="glass-card">';
        html += '<div class="cta-box"><div>';
        html += '<h3 style="font-family:Outfit,sans-serif;font-size:1.1rem;color:#fff;margin-bottom:4px">Ready to Download</h3>';
        html += '<p style="font-size:0.8rem;color:var(--text-muted);margin:0">Source: ' + esc(hostname || 'External Link') + '</p></div>';
        if (downloadUrl) {
            html += '<a href="' + esc(downloadUrl) + '" target="_blank" rel="noopener" class="btn-download"><i class="fas fa-download"></i> Download Scenepack</a>';
        } else {
            html += '<span style="color:var(--text-muted);font-size:0.85rem">No download link available</span>';
        }
        html += '</div>';

        // Meta Grid
        html += '<div class="meta-grid">';
        html += '<div class="meta-item"><div class="meta-icon"><i class="fas fa-calendar-alt"></i></div><div class="meta-text"><strong>' + (p.created_at ? new Date(p.created_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : 'Recently') + '</strong><span>Published</span></div></div>';
        html += '<div class="meta-item"><div class="meta-icon"><i class="fas fa-cloud"></i></div><div class="meta-text"><strong>' + esc(hostname || 'External') + '</strong><span>Source Host</span></div></div>';
        html += '</div>';

        // Creators Section
        var uploaderName = p.uploader_name || p.author_name || '';
        var hasUploader = !!uploaderName;
        var hasCreator = !!(p.creator_nickname || p.creator_social_url);

        if (hasUploader || hasCreator) {
            html += '<div class="creators-flex">';
            if (hasUploader) {
                var uploaderAvatarSrc = p.uploader_avatar || (p.uploader_id ? (typeof avatarProxyUrl === 'function' ? avatarProxyUrl(p.uploader_id, p.uploader_avatar, 64) : '') : '');
                html += '<div class="creator-card"><div class="creator-avatar">' + (uploaderAvatarSrc ? '<img src="' + esc(uploaderAvatarSrc) + '" onerror="this.outerHTML=\'<i class=\\\'fab fa-discord\\\'></i>\'">' : '<i class="fab fa-discord" style="color:#5865F2"></i>') + '</div><div class="creator-info"><strong>' + esc(uploaderName) + '</strong><span>Uploaded by (Discord)</span></div></div>';
            }
            if (hasCreator) {
                html += '<div class="creator-card"><div class="creator-avatar">' + (p.creator_avatar ? '<img src="' + esc(p.creator_avatar) + '" onerror="this.outerHTML=\'<i class=\\\'fas fa-user\\\'></i>\'">' : '<i class="fas fa-user"></i>') + '</div><div class="creator-info"><strong>' + esc(p.creator_nickname || 'Creator') + '</strong>' + (p.creator_social_url ? '<a href="' + esc(p.creator_social_url) + '" target="_blank">View Social Profile</a>' : '<span>Original Creator</span>') + '</div></div>';
            }
            html += '</div>';
        }

        html += '</div>';

        document.getElementById('root').innerHTML = html;
    }
    </script>
</body>
</html>
