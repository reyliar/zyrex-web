<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zyrex Scenepacks - Premium scene packs & project templates">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zyrexediting.xyz/product-scenepack">
    <meta property="og:title" content="Zyrex | Scenepack">
    <meta property="og:description" content="Premium scenepacks on Zyrex">
    <meta name="author" content="Zyrex">
    <title>Zyrex | Scenepack</title>
    <link rel="icon" type="image/png" href="/assets/content.png">
    <link rel="stylesheet" href="css/style.css?v=24">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cherry: #ff2b52;
            --cherry-rgb: 255, 43, 82;
            --cherry-light: #ff6b85;
            --glass-bg: rgba(14, 10, 18, 0.85);
            --glass-border: rgba(255, 255, 255, 0.11);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            background: #070209;
            color: #f8f5f6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 43, 82, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(120, 0, 40, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 20, 0.08) 0%, transparent 50%);
        }

        .sp-page {
            padding: 130px 0 90px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.8);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 32px;
            backdrop-filter: blur(20px);
            transition: all 0.25s ease;
        }
        .back:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            transform: translateX(-3px);
        }

        /* Minimalist Glass Card */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 36px;
            backdrop-filter: blur(32px) saturate(210%);
            -webkit-backdrop-filter: blur(32px) saturate(210%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        /* WIDESCREEN 16:9 LANDSCAPE THUMBNAIL HERO CONTAINER */
        .sp-widescreen-hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 480px;
            border-radius: 24px;
            overflow: hidden;
            background: #080206;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 43, 82, 0.15);
            margin-bottom: 28px;
        }
        .sp-widescreen-hero img.hero-bg-blur {
            position: absolute;
            inset: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            object-fit: cover;
            filter: blur(28px) brightness(0.4);
            opacity: 0.8;
            pointer-events: none;
        }
        .sp-widescreen-hero img.hero-main-img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sp-widescreen-hero:hover img.hero-main-img {
            transform: scale(1.03);
        }
        .sp-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, transparent 50%, rgba(7, 2, 9, 0.9) 100%);
            z-index: 3;
        }

        /* Play Button Overlay */
        .sp-hero-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 43, 82, 0.9);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 30px rgba(255, 43, 82, 0.7);
            z-index: 4;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .sp-widescreen-hero:hover .sp-hero-play {
            transform: translate(-50%, -50%) scale(1.12);
            box-shadow: 0 0 45px rgba(255, 43, 82, 0.9);
        }

        /* Hero Badges */
        .sp-hero-badges {
            position: absolute;
            top: 18px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 4;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(255, 43, 82, 0.15);
            border: 1px solid rgba(255, 43, 82, 0.3);
            color: var(--cherry-light);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
        }

        .sp-meta h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.25;
        }
        .sp-meta p.desc {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.65;
        }

        /* Minimal Single CTA */
        .cta-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 24px 32px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            margin-top: 10px;
        }
        @media (max-width: 640px) {
            .cta-box { flex-direction: column; text-align: center; }
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff2b52, #c8002a);
            color: #fff;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 0.94rem;
            box-shadow: 0 10px 25px rgba(255, 43, 82, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(255, 43, 82, 0.55);
        }

        /* Creators & Uploaders (Audio Page Style) */
        .creators-flex {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        .creator-card {
            flex: 1;
            min-width: 240px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
        }
        .creator-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--cherry);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,43,82,0.15);
            color: #fff;
            flex-shrink: 0;
        }
        .creator-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .creator-info strong { display: block; font-size: 0.92rem; color: #fff; font-family: 'Outfit', sans-serif; }
        .creator-info span { font-size: 0.74rem; color: var(--text-muted); }
        .creator-info a { color: var(--cherry-light); text-decoration: none; font-size: 0.75rem; font-weight: 600; margin-top: 2px; display: inline-block; }
        .creator-info a:hover { text-decoration: underline; }

        .load-state, .err-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .load-state i, .err-state i { font-size: 2.5rem; color: var(--cherry-light); margin-bottom: 16px; display: block; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <img src="assets/content.png" alt="ZYREX" class="logo-img">
                <span class="logo-text">yrex</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="/">Home</a></li>
                <li><a href="/resources">Resources</a></li>
                <li><a href="/scenepack.html">Scenepacks</a></li>
                <li><a href="/plugins">Plugins</a></li>
                <li><a href="/more">More</a></li>
            </ul>
            <div class="nav-actions">
                <div id="authBtn"></div>
                <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <main class="sp-page">
        <div class="wrap">
            <a href="/scenepack.html" class="back"><i class="fas fa-arrow-left"></i> Back to Scenepacks</a>

            <div id="load" class="load-state">
                <i class="fas fa-clapperboard fa-spin"></i>
                <p>Loading scenepack details...</p>
            </div>

            <div id="err" class="err-state" style="display:none">
                <i class="fas fa-triangle-exclamation"></i>
                <h2 style="font-family:Outfit,sans-serif;color:#fff;margin-bottom:8px" id="errMsg">Scenepack not found</h2>
                <a href="/scenepack.html" class="btn-download" style="margin-top:16px"><i class="fas fa-clapperboard"></i> Browse Scenepacks</a>
            </div>

            <div id="root" style="display:none"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 Zyrex Editing. All rights reserved.</p></div>
        </div>
    </footer>

    <script src="js/auth.js?v=10"></script>
    <script src="js/script.js?v=5"></script>
    <script>
    var discordAvatarCache = {};

    // Fetch Discord profile photo via Zyrex VPS Bot API (with 2.5s timeout for fast loads)
    async function fetchZyrexBotAvatar(uploaderId, fallbackHashOrUrl) {
        if (!uploaderId) {
            if (fallbackHashOrUrl && fallbackHashOrUrl.startsWith('http')) return fallbackHashOrUrl;
            if (fallbackHashOrUrl) return '/api/avatar/0/' + fallbackHashOrUrl + '.png?size=128';
            return 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
        if (discordAvatarCache[uploaderId]) return discordAvatarCache[uploaderId];

        try {
            var controller = new AbortController();
            var timer = setTimeout(function(){ controller.abort(); }, 2500);

            var resp = await fetch('/api/presence/' + uploaderId, {
                headers: {
                    "X-Zyrex-Key": "zyrex_app_sec_k982f81a7b54c29013e9a",
                    "Accept": "application/json"
                },
                signal: controller.signal
            });
            clearTimeout(timer);

            if (resp.ok) {
                var json = await resp.json();
                var d = json.data || json[uploaderId] || json;
                var u = d.discord_user || d;
                if (u && u.avatar) {
                    var avatarUrl = '';
                    if (u.avatar.startsWith('http://') || u.avatar.startsWith('https://')) {
                        avatarUrl = u.avatar;
                    } else {
                        var ext = u.avatar.startsWith('a_') ? 'gif' : 'png';
                        avatarUrl = '/api/avatar/' + uploaderId + '/' + u.avatar + '.' + ext + '?size=128';
                    }
                    discordAvatarCache[uploaderId] = avatarUrl;
                    return avatarUrl;
                }
            }
        } catch(e) {}

        if (fallbackHashOrUrl) {
            if (fallbackHashOrUrl.startsWith('http')) return fallbackHashOrUrl;
            var ext = fallbackHashOrUrl.startsWith('a_') ? 'gif' : 'png';
            return '/api/avatar/' + uploaderId + '/' + fallbackHashOrUrl + '.' + ext + '?size=128';
        }
        return 'https://cdn.discordapp.com/embed/avatars/0.png';
    }

    (async function(){
        var p = new URLSearchParams(location.search);
        var id = p.get('id');
        if (!id) return showErr('Scenepack ID missing');
        try {
            var r = await fetch('/api/products?id=' + encodeURIComponent(id));
            var data = null;
            if (r.ok) data = await r.json();

            if (Array.isArray(data)) {
                data = data.find(x => String(x.id) === String(id)) || data[0];
            }
            if (data && data.data && !data.id) data = data.data;

            if (!data || !data.id) {
                try {
                    var editedMap = JSON.parse(localStorage.getItem('zyrex_edited_products') || '{}');
                    if (editedMap[id]) data = editedMap[id];
                } catch(e) {}
            }

            if (!data || !data.id) { showErr('Scenepack not found'); return; }
            await render(data);
        } catch(e) { showErr('Failed to load scenepack'); }
    })();

    function showErr(m) {
        document.getElementById('load').style.display = 'none';
        document.getElementById('err').style.display = 'block';
        document.getElementById('errMsg').innerHTML = m;
    }

    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    async function render(p) {
        document.getElementById('load').style.display = 'none';
        document.getElementById('root').style.display = 'block';
        document.title = (p.name || 'Scenepack') + ' \u2014 Zyrex Scenepacks';

        var downloadUrl = p.source_url || p.file_url || p.url || '';
        var hostname = '';
        try { hostname = new URL(downloadUrl).hostname.replace('www.', ''); } catch(e) {}

        var html = '';

        // 1. WIDESCREEN 16:9 LANDSCAPE THUMBNAIL HERO SHOWCASE
        var thumbUrl = p.thumbnail || 'assets/content.png';
        html += '<div class="sp-widescreen-hero">';
        html += '<img src="' + esc(thumbUrl) + '" class="hero-bg-blur" alt="">';
        html += '<img src="' + esc(thumbUrl) + '" class="hero-main-img" alt="' + esc(p.name) + '" onerror="this.src=\'assets/content.png\'">';
        html += '<div class="sp-hero-overlay"></div>';
        html += '<div class="sp-hero-play"><i class="fas fa-play"></i></div>';
        html += '<div class="sp-hero-badges">';
        html += '<span class="type-badge"><i class="fas fa-clapperboard"></i> Scenepack</span>';
        html += '</div>';
        html += '</div>';

        // 2. MAIN GLASS DETAILS CARD
        html += '<div class="glass-card">';
        html += '<div class="sp-meta">';
        html += '<h1>' + esc(p.name || 'Untitled Scenepack') + '</h1>';
        html += '<p class="desc">' + esc(p.description || p.desc || 'No description provided for this scenepack.') + '</p>';
        html += '</div>';

        // 3. CTA DOWNLOAD BOX
        html += '<div class="cta-box"><div>';
        html += '<h3 style="font-family:Outfit,sans-serif;font-size:1.1rem;color:#fff;margin-bottom:4px">Download Scenepack</h3>';
        html += '<p style="font-size:0.8rem;color:var(--text-muted);margin:0">Host: ' + esc(hostname || 'Direct Link / External Host') + '</p></div>';
        if (downloadUrl) {
            html += '<a href="' + esc(downloadUrl) + '" target="_blank" rel="noopener" class="btn-download"><i class="fas fa-download"></i> Download Scenepack</a>';
        } else {
            html += '<span style="color:var(--text-muted);font-size:0.85rem">No download link available</span>';
        }
        html += '</div>';

        // 4. CREATORS & UPLOADERS SECTION (ZYREX VPS BOT API DISCORD AVATAR)
        var uploaderName = p.uploader_name || p.author_name || '';
        var uploaderId = p.uploader_id || p.author_id || '';
        var creatorName = p.creator_nickname || '';
        var hasUploader = !!uploaderName;
        var hasCreator = !!(creatorName || p.creator_social_url || p.creator_avatar);

        if (hasUploader || hasCreator) {
            html += '<div class="creators-flex">';
            
            // Uploader Card (Using Zyrex VPS Bot API for Discord Avatar & NO "(discord)" text)
            if (hasUploader) {
                var uploaderImg = await fetchZyrexBotAvatar(uploaderId, p.uploader_avatar);

                html += '<div class="creator-card"><div class="creator-avatar">';
                if (uploaderImg) {
                    html += '<img src="' + esc(uploaderImg) + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">';
                } else {
                    html += '<i class="fab fa-discord" style="color:#5865F2"></i>';
                }
                html += '</div><div class="creator-info"><strong>' + esc(uploaderName) + '</strong><span>Uploaded by</span></div></div>';
            }

            // Original Creator Card
            if (hasCreator) {
                html += '<div class="creator-card"><div class="creator-avatar">';
                if (p.creator_avatar) {
                    html += '<img src="' + esc(p.creator_avatar) + '" onerror="this.outerHTML=\'<i class=\\\'fas fa-user\\\'></i>\'">';
                } else {
                    html += '<i class="fas fa-user"></i>';
                }
                html += '</div><div class="creator-info"><strong>' + esc(creatorName || 'Original Creator') + '</strong>';
                if (p.creator_social_url) {
                    html += '<a href="' + esc(p.creator_social_url) + '" target="_blank">View Social Profile</a>';
                } else {
                    html += '<span>Original Creator</span>';
                }
                html += '</div></div>';
            }

            html += '</div>';
        }

        html += '</div>';

        document.getElementById('root').innerHTML = html;
    }
    </script>
</body>
</html>
