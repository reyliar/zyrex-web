<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Zyrex</title>
    <meta name="description" content="The page you requested could not be found on Zyrex Editing.">
    <link rel="icon" type="image/png" href="/assets/content.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cherry: #ff2b52;
            --cherry-rgb: 255, 43, 82;
            --dark: #060608;
            --light: #ffffff;
            --gray: rgba(255, 255, 255, 0.45);
        }
        * { margin:0; padding:0; box-sizing:border-box }
        body {
            background: #060608;
            color: var(--light);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .bg-grid {
            position: fixed; inset:0; pointer-events: none; z-index:0;
            background-image: radial-gradient(circle at 50% 35%, rgba(255,43,82,0.15) 0%, transparent 65%);
        }
        .glow {
            position: fixed;
            width: 500px; height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: .14;
            pointer-events: none;
            background: var(--cherry);
            top: 25%; left: 50%; transform: translate(-50%,-50%);
        }

        /* iOS 26 GLASS CONTAINER CARD */
        .wrap {
            position: relative; z-index:1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 46px 36px;
            max-width: 520px;
            width: calc(100% - 40px);
            background: rgba(14, 10, 18, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            backdrop-filter: blur(36px) saturate(210%);
            -webkit-backdrop-filter: blur(36px) saturate(210%);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .code-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .code-badge img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            filter: drop-shadow(0 0 14px rgba(255,43,82,0.6));
        }

        .code {
            font-size: clamp(5.5rem, 16vw, 8rem);
            font-weight: 900;
            letter-spacing: -3px;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #ff6b8b 50%, #ff2b52 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 6px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .tag {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b8b;
            background: rgba(255, 43, 82, 0.12);
            border: 1px solid rgba(255, 43, 82, 0.3);
            padding: 6px 18px;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--gray);
            font-size: 0.88rem;
            margin-bottom: 28px;
            max-width: 400px;
            line-height: 1.6;
        }
        
        .btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 26px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
            cursor: pointer;
        }
        .btn-primary {
            background: rgba(255, 43, 82, 0.16);
            border: 1px solid rgba(255, 43, 82, 0.4);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 43, 82, 0.25);
            backdrop-filter: blur(16px);
        }
        .btn-primary:hover {
            background: rgba(255, 43, 82, 0.28);
            box-shadow: 0 10px 30px rgba(255, 43, 82, 0.4);
            transform: scale(1.03);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow"></div>
    
    <div class="wrap">
        <div class="code-badge">
            <img src="/assets/content.png" alt="Zyrex">
        </div>
        <div class="code">404</div>
        <div class="tag">Page Not Found</div>
        <h1>Lost in the Void?</h1>
        <p>The link you followed might be broken, moved or no longer exists. Let's get you back on track.</p>
        <div class="btns">
            <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
            <a href="/presets" class="btn btn-ghost"><i class="fas fa-cubes"></i> Browse Resources</a>
        </div>
    </div>
</body>
</html>
